name: Foundation checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npx --yes npm@11.16.0 --version
      - run: composer validate --strict && composer install --no-interaction --prefer-dist
      - run: composer scope && composer test && composer analyse && composer lint
      - run: npx --yes npm@11.16.0 ci --no-audit --no-fund
      - run: npm run schema:types && git diff --exit-code -- assets/src/shared
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - run: npm run package && php tools/verify-package.php
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chatflow-forms
          path: build/chatflow-forms.zip
          if-no-files-found: error
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        multisite: [false, true]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: composer install --no-interaction --prefer-dist && composer scope && npx --yes npm@11.16.0 ci --no-audit --no-fund
      - run: npm run env:start
      - if: ${{ !matrix.multisite }}
        run: npm run test:wp
      - if: ${{ matrix.multisite }}
        run: npm run test:wp:multisite
      - if: always()
        run: npm run env:stop
