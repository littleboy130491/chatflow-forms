name: Browser acceptance
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: composer install --no-interaction --prefer-dist && composer scope
      - run: npx --yes npm@11.16.0 ci --no-audit --no-fund && npm run build
      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Start disposable WordPress
        run: npm run env:start
      - name: Seed test forms and pages
        run: node tools/wp-env.mjs run cli --env-cwd=wp-content/plugins/chatflow-forms env CFF_E2E=1 wp eval-file tests/e2e/seed.php
      - name: Run real Chromium desktop and mobile journeys
        run: npm run test:e2e
      - name: Inspect WordPress container failures
        if: failure()
        run: |
          docker ps --format 'table {{.Names}}\\t{{.Status}}'
          for container in $(docker ps -q); do
            echo "=== Container ${container} ==="
            docker logs --tail 150 "${container}" 2>&1 || true
          done
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
      - if: always()
        run: npm run env:stop
